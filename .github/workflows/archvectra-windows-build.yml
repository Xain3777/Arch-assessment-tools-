name: ArchVectra Windows build

on:
  workflow_dispatch:
  push:
    paths: ["archvectra/**", ".github/workflows/archvectra-windows-build.yml"]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: archvectra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] pyinstaller
      - name: Test
        run: python -m pytest -q
      - name: Build archvectra.exe
        run: packaging\build_windows.bat
        shell: cmd
      - name: Smoke test the executable
        shell: cmd
        run: |
          dist\ArchVectra\engine\archvectra.exe --version || exit /b 1
          dist\ArchVectra\engine\archvectra.exe process samples\synthetic_scan.pdf -o smoke --scale 100 || exit /b 1
          type smoke\summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ArchVectra-windows
          path: archvectra/dist/ArchVectra
