[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archvectra"
version = "0.1.0"
description = "Architectural PDF vectorisation: scanned / vector / hybrid PDFs to clean vector PDF, SVG and DXF"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Not yet chosen - see README (PyMuPDF dependency is AGPL-3.0)" }
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "PyMuPDF>=1.24",
  "shapely>=2.0",
  "networkx>=3.2",
  "ezdxf>=1.2",
  "scikit-image>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# OCR for dimension numbers / grid labels (RapidOCR, Apache-2.0). It declares opencv-python as a
# dependency, which duplicates opencv-python-headless; prefer:
#   pip install --no-deps rapidocr-onnxruntime==1.2.3 && pip install onnxruntime pyclipper PyYAML six Pillow tqdm
ocr = ["rapidocr-onnxruntime==1.2.3"]  # tested version; newer releases changed dependencies

[project.scripts]
archvectra = "archvectra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
