# archvectra default configuration (generated from archvectra/config.py).
# All lengths are millimetres on the drawing sheet unless the key says otherwise.
# Override any value on the command line:  --set correct.snap_distance_mm=2.0

# Stage A - acquisition
[input]
page = 0
dpi = 300
prefer_native_image = true
max_pixels = 100000000
min_dpi_warning = 200

# Stage B - preprocessing (sizes in sheet millimetres)
[preprocess]
deskew = true
max_skew_deg = 5.0
denoise = "median"
median_ksize = 3
clahe = false
threshold = "otsu"
adaptive_block_mm = 6.0
adaptive_c = 12
min_component_area_mm2 = 0.05
close_gaps_mm = 0.0
perspective = false

# Stage C - geometry extraction (sheet millimetres)
[extract]
min_line_length_mm = 3.0
wall_min_thickness_mm = 0.9
text_max_size_mm = 4.5
rdp_epsilon_mm = 0.2
detect_curves = true
arc_max_residual_mm = 0.25
arc_min_sweep_deg = 25.0
column_max_size_mm = 8.0

# Stage E/D - correction and openings (sheet mm; defaults suit 1:100)
[correct]
angle_tolerance_deg = 2.0
collinear_offset_mm = 0.35
merge_gap_mm = 0.8
snap_distance_mm = 1.5
opening_min_mm = 5.0
opening_max_mm = 25.0
thickness_cluster_tolerance = 0.18
door_arc_radius_tolerance = 0.25
pair_double_line_walls = true
double_wall_min_mm = 0.8
double_wall_max_mm = 4.0

# Stage F - scale. denominator = 100 means 1:100
[scale]
# denominator =   (unset)
# known_distance_px =   (unset)
# known_distance_mm =   (unset)
units = "mm"

# Stage H - export
[export]
formats = ["pdf", "svg", "dxf"]
line_width_mm = 0.18
wall_outline_width_mm = 0.25
wall_fill = true
include_annotations = true
annotation_backend = "auto"
include_text = true
preserve_vector_style = true
review_pdf = true
dwg = false

# Validation
[validation]
tolerance_mm = 0.4
enabled = true
comparison_max_width_px = 3600
